apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nkp-dummy-ocp
  # OpenShift GitOps memakai namespace openshift-gitops. Sesuaikan bila ArgoCD
  # tim berada di namespace lain.
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/krismian/nkp-dummy.git
    targetRevision: main
    path: chart/nkp-dummy
    helm:
      valueFiles:
        - values-ocp.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nkp-dummy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
