apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nkp-dummy-nkp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/krismian/nkp-dummy.git
    targetRevision: main
    path: chart/nkp-dummy
    helm:
      valueFiles:
        - values-nkp.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: nkp-dummy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
