{{- range $app := .Values.apps }}
{{- range $env := $app.environments }}
{{- range $site := $env.sites }}
{{- $destination := required (printf "site %q belum ada di sites" $site) (index $.Values.sites $site) }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "credentials-%s-%s-%s" $app.name $env.name $site }}
  namespace: {{ $.Values.argocdNamespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: credential
  source:
    repoURL: {{ $.Values.credentials.repoURL }}
    targetRevision: {{ $.Values.credentials.targetRevision }}
    path: {{ printf "%s/%s" $.Values.credentials.pathPrefix $env.name }}
    directory:
      recurse: true
      include: {{ printf "*/*/%s/*.yaml" $site | quote }}
  destination:
    {{- if $destination.server }}
    server: {{ $destination.server }}
    {{- else }}
    name: {{ $destination.name }}
    {{- end }}
    namespace: {{ printf "%s-%s" $app.name $env.name }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
{{- end }}
{{- end }}
{{- end }}
