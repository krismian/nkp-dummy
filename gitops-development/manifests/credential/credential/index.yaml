argocdNamespace: openshift-gitops

credentials:
  repoURL: https://github.com/krismian/nkp-dummy.git
  targetRevision: main
  pathPrefix: credentials

# Harus sama dengan sites di manifests/<proyek>/<layer>/index.yaml.
sites:
  lab:
    server: https://kubernetes.default.svc
  nkp:
    name: nkp-poc

apps:
  - name: nkp-dummy
    environments:
      - name: develop
        sites:
          - lab
