apiVersion: apps/v1
kind: Deployment
metadata:
  name: nkp-dummy
  labels:
    app: nkp-dummy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nkp-dummy
  template:
    metadata:
      labels:
        app: nkp-dummy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nkp-dummy
          image: ghcr.io/krismian/nkp-dummy:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nkp-dummy
spec:
  selector:
    app: nkp-dummy
  ports:
    - name: http
      port: 80
      targetPort: http
