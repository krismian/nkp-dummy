environmentname: ""

common:
  environment: develop
  replicaCount: 1
  image:
    repository: ghcr.io/krismian/nkp-dummy-web
    tag: latest
    pullPolicy: Always
  imagePullSecrets: []
  # Service backend di namespace yang sama. Nama service = release Helm backend.
  backendURL: http://nkp-dummy:8080
  service:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

route:
  enabled: true
  host: ""

ingress:
  enabled: false
  className: ""
  host: ""
  path: /
  tlsSecretName: ""
