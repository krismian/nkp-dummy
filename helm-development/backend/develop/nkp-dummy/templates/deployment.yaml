apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nkp-dummy.fullname" . }}
  labels:
    {{- include "nkp-dummy.labels" . | nindent 4 }}
  annotations:
    # ConfigMap dan Secret datang dari Application credential, bukan chart ini,
    # jadi restart saat isinya berubah diserahkan ke Stakater Reloader.
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.common.replicaCount }}
  selector:
    matchLabels:
      {{- include "nkp-dummy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nkp-dummy.labels" . | nindent 8 }}
    spec:
      {{- with .Values.common.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Tanpa runAsUser: OpenShift memberi UID acak dari rentang namespace,
      # sedangkan Kubernetes biasa memakai UID non-root dari image.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.common.image.repository }}:{{ .Values.common.image.tag }}"
          imagePullPolicy: {{ .Values.common.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "nkp-dummy.configMapName" . }}
            - secretRef:
                name: {{ include "nkp-dummy.credentialName" . }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.common.resources | nindent 12 }}
