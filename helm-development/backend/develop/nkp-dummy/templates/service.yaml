apiVersion: v1
kind: Service
metadata:
  name: {{ include "nkp-dummy.fullname" . }}
  labels:
    {{- include "nkp-dummy.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "nkp-dummy.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.common.service.port }}
      targetPort: http
