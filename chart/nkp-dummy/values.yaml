replicaCount: 2

image:
  repository: ghcr.io/krismian/nkp-dummy
  tag: v0.2.0
  pullPolicy: IfNotPresent

# Kosong karena package ghcr.io public. Isi bila image dipindah ke registry privat.
imagePullSecrets: []

config:
  PLATFORM: kubernetes
  APP_ENV: poc
  APP_MESSAGE: Halo dari nkp-dummy

secret:
  # Isi dengan nama Secret yang dibuat di luar chart (Sealed Secrets, External
  # Secrets, atau kubectl). Bila kosong, chart membuat Secret dari `data`.
  existingSecret: ""
  data:
    DB_PASSWORD: dummy-bukan-rahasia

service:
  port: 80

route:
  enabled: false
  host: ""

ingress:
  enabled: false
  className: ""
  host: ""
  path: /
  tlsSecretName: ""

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi
